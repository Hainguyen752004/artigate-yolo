# A2: A1 (CBAM on B2/B3) plus the artifact head trained as an auxiliary task; the map is not used.
# AGA and ArtifactHead take their input channels from parse_model (register_modules patches it);
# CBAM channel arguments are the scale-n widths, as in A1.
nc: 1 # overridden by the dataset YAML at train time
end2end: True
reg_max: 1
scale: n
art_loss:
  lambda: 1.0 # weight of the artifact loss (BCE + Dice on partial labels); --art-lambda overrides it
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 (B2)
  - [2, 1, ArtifactHead, [4, 32]] # 3 artifact logits (hair, ruler, marker, dark corner) at stride 4
  - [2, 1, CBAM, [64]] # 4 attention on P2
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 6 (B3)
  - [-1, 1, CBAM, [128]] # 7 attention on P3
  - [-1, 1, Conv, [512, 3, 2]] # 8-P4/16
  - [-1, 2, C3k2, [512, True]] # 9
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 2, C3k2, [1024, True]] # 11
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 12
  - [-1, 2, C2PSA, [1024]] # 13
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P3 (after attention)
  - [-1, 2, C3k2, [256, True]] # 19
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P2 (after attention)
  - [-1, 2, C3k2, [128, True]] # 22 (P2/4)
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 19], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, True]] # 25 (P3/8)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 28 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 31 (P5/32)
  - [[22, 25, 28, 31], 1, Segment26, [nc, 32, 256]] # Segment(P2, P3, P4, P5)
